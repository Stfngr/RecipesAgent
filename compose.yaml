services:
  recipe-bot:
    image: ${RECIPE_BOT_IMAGE:-ghcr.io/stfngr/recipesagent:latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/recipe-bot/.env
    volumes:
      - /etc/recipe-bot/settings.json:/etc/recipe-bot/settings.json:ro
      - /var/lib/recipe-bot:/var/lib/recipe-bot
    networks:
      - bot-network

  ollama:
    image: ollama/ollama:latest
    profiles:
      - translation
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - recipe-ollama:/root/.ollama
    networks:
      - bot-network

volumes:
  recipe-ollama:
    name: recipe-ollama

networks:
  bot-network:
    external: true
