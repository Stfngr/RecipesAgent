services:
  recipe-bot:
    image: ${RECIPE_BOT_IMAGE:-ghcr.io/stfngr/recipesagent:latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/recipe-bot/.env
    volumes:
      - /etc/recipe-bot/settings.json:/etc/recipe-bot/settings.json:ro
      - /var/lib/recipe-bot:/var/lib/recipe-bot
    networks:
      - bot-network

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    profiles:
      - translation
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: "en,de"
      LT_DISABLE_WEB_UI: "true"
      LT_THREADS: "1"
    volumes:
      - recipe-libretranslate:/home/libretranslate/.local
    networks:
      - bot-network

volumes:
  recipe-libretranslate:
    name: recipe-libretranslate

networks:
  bot-network:
    external: true
