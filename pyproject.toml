[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-bot"
version = "0.1.0"
description = "Daily recipe selections for a Telegram chat"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<0.29", "lara-sdk>=1,<2", "python-dotenv>=1,<2"]

[project.scripts]
recipe-bot = "recipe_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
